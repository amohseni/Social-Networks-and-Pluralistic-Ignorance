# Tiny grid for testing the sweep pipeline end to end.
name: smoke
seeds_per_cell: 2
m: [30, census]
blocks:
  - scenario: S1
    n: [60]
    topologies: {ba: {m: [2]}, regular: {k: [4]}}
    pi0: [0.6]
    alpha: ["uniform", "beta(3,1)"]
  - scenario: S2
    pure: true
    n: [60]
    topologies: {ba: {m: [2]}}
    pi0: [0.7]
    lambda: [0, 4]
  - scenario: S3
    n: [60]
    topologies: {regular: {k: [4]}}
    psi: [0.7]
    alpha: ["beta(3,1)"]
